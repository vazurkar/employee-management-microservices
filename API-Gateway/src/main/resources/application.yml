eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceurl:
      defaultZone: http://localhost:8761/eureka

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: AddressService
              uri: lb://AddressService
              predicates:
                - Path=/address/**
              filters:
                - AuthFilter

            - id: AUTHSERVICE
              uri: lb://AUTHSERVICE
              predicates:
                - Path=/auth/**

            - id: EmployeeService
              uri: lb://EmployeeService
              predicates:
                - Path=/employees/**
              filters:
                - AuthFilter